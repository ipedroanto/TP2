version: '3.8'

services:
  # ==========================================
  # 1. Base de Datos Relacional (MySQL)
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: feedback-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: feedback_db
      MYSQL_USER: feedback_user
      MYSQL_PASSWORD: feedback_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      
  # ==========================================
  # 2. Backend de Reglas y Validación (FastAPI)
  # ==========================================
  python-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: python-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: feedback_db
      DB_USER: feedback_user
      DB_PASSWORD: feedback_password_123
      DATABASE_URL: mysql+pymysql://feedback_user:feedback_password_123@mysql:3306/feedback_db
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  # ==========================================
  # 3. Orquestador de Flujos (n8n)
  # ==========================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n-orchestrator
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - python-api

# ==========================================
# Volúmenes Persistentes y Red Unificada
# ==========================================
volumes:
  mysql_data:
    driver: local
  n8n_data:
    driver: local

networks:
  default:
    name: feedback_network
